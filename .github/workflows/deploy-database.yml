# Applies new migrations in supabase/migrations to the production Supabase project
# whenever they land on main. Never runs seed.sql (demo data stays local).
#
# Repository secrets (GitHub → Settings → Secrets and variables → Actions):
#   SUPABASE_ACCESS_TOKEN  – personal access token from supabase.com/dashboard/account/tokens
#   SUPABASE_DB_PASSWORD   – the database password chosen when the project was created
#   SUPABASE_PROJECT_ID    – project reference id (the part after /project/ in the dashboard URL)
name: Deploy database

on:
  push:
    branches: [main]
    paths: ["supabase/migrations/**"]
  workflow_dispatch:

concurrency:
  group: deploy-database
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: 3.1.0

      - name: Check secrets
        run: |
          for name in SUPABASE_ACCESS_TOKEN SUPABASE_DB_PASSWORD SUPABASE_PROJECT_ID; do
            if [ -z "${!name}" ]; then echo "::error::Missing repository secret $name"; exit 1; fi
          done

      # Supabase CLI v3: commands target the local database unless --remote is passed.
      - name: Link project
        run: supabase link --project-ref "$SUPABASE_PROJECT_ID"

      - name: Show pending migrations
        run: supabase migration list --remote --password "$SUPABASE_DB_PASSWORD"

      - name: Apply migrations
        run: supabase db push --remote --password "$SUPABASE_DB_PASSWORD"
